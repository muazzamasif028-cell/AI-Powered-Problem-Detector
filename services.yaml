# ============================================================
# 🌐 Kubernetes Services
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: ai-gateway
  namespace: supreme-production
  labels:
    app: ai-gateway
spec:
  type: ClusterIP
  selector:
    app: ai-gateway
  ports:
  - port: 3002
    targetPort: 3002
    name: http
  - port: 9091
    targetPort: 9091
    name: metrics
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: supreme-production
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
  - port: 3001
    targetPort: 3001

---
apiVersion: v1
kind: Service
metadata:
  name: memory-service
  namespace: supreme-production
spec:
  type: ClusterIP
  selector:
    app: memory-service
  ports:
  - port: 3003
    targetPort: 3003
