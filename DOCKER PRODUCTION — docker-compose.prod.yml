# ============================================================
# 🤫 SUPREME PLATFORM — PRODUCTION DOCKER COMPOSE
# ============================================================

version: '3.8'

services:
  # NGINX Reverse Proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: supreme-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/supreme.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./public:/var/www/supreme-platform/public:ro
    depends_on:
      - app
    networks:
      - supreme-prod
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # Node.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: supreme-app-prod
    restart: always
    expose:
      - "5000"
    env_file:
      - .env.production
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    networks:
      - supreme-prod
    deploy:
      replicas: 4
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "10"

  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: supreme-mongo-prod
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
      MONGO_INITDB_DATABASE: supreme-platform
    volumes:
      - mongodb-prod-data:/data/db
      - ./scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - supreme-prod
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # Redis
  redis:
    image: redis:7.2-alpine
    container_name: supreme-redis-prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASS} --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis-prod-data:/data
    networks:
      - supreme-prod
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # Monitoring — Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: supreme-prometheus
    restart: always
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - supreme-prod
    ports:
      - "9090:9090"

  # Monitoring — Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: supreme-grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana-dashboards:/etc/grafana/provisioning/dashboards
    networks:
      - supreme-prod
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  mongodb-prod-data:
  redis-prod-data:
  prometheus-data:
  grafana-data:

networks:
  supreme-prod:
    driver: bridge
