# ============================================================
# 🔐 Kubernetes Secrets (Use Sealed Secrets in production!)
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: supreme-secrets
  namespace: supreme-production
type: Opaque
stringData:
  # Database
  MONGODB_URI: "mongodb://supreme:password@mongodb-primary:27017/supreme?replicaSet=rs0"
  POSTGRES_URI: "postgresql://supreme:password@postgres-primary:5432/supreme"
  REDIS_URL: "redis://:password@redis-cluster:6379/0"
  
  # JWT
  JWT_SECRET: "supreme-jwt-secret-change-in-production-min-32-chars!!"
  
  # AI Providers
  OPENAI_API_KEY: "sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  ANTHROPIC_API_KEY: "sk-ant-xxxxxxxxxxxxxxxxxxxxxxxx"
  GOOGLE_AI_KEY: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  
  # Billing
  STRIPE_SECRET_KEY: "sk_live_xxxxxxxxxxxxxxxx"
  STRIPE_WEBHOOK_SECRET: "whsec_xxxxxxxxxxxxxxxx"
  
  # Email
  SMTP_HOST: "smtp.resend.com"
  SMTP_PORT: "587"
  SMTP_USER: "resend"
  SMTP_PASS: "xxxxxxxxxxxxxxxx"
  
  # Encryption
  ENCRYPTION_KEY: "supreme-32-char-encryption-key!!"
  
  # RabbitMQ
  RABBITMQ_USER: "supreme"
  RABBITMQ_PASS: "rabbitmq-password"
